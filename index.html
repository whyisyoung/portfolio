<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limin Yang's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Raleway:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/shared-header.js"></script>
</head>

<body>

  <main class="gallery-container">
    <div class="gallery-grid" id="gallery">
      <!-- Images will be loaded here -->
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-header">
      <div class="lightbox-header-inner">
        <span class="lightbox-title" onclick="closeLightboxAndReturnHome()">Limin Yang</span>
        <span class="close">&times;</span>
      </div>
    </div>
    <img class="lightbox-content" id="lightbox-img">
    <div class="nav-buttons">
      <button class="prev" aria-label="Previous image"></button>
      <button class="next" aria-label="Next image"></button>
    </div>
  </div>

  <script src="js/shared-footer.js"></script>
  <script src="js/script.js"></script>
  <script src="js/spa-nav.js" defer></script>
</body>

</html>
